name: Database checks

on:
  pull_request:
  push:
    branches: [feat/ayush-db]

permissions:
  contents: read

jobs:
  database:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: python -m uv sync --locked
      - run: python -m uv run ruff format --check .
      - run: python -m uv run ruff check .
      - run: python -m uv run mypy --strict src
      - run: python -m uv run pytest -m "not bench"
      - run: python -m uv export --locked --no-emit-project --format requirements-txt --output-file .audit-requirements.txt
      - run: python -m uv run --locked pip-audit --disable-pip --require-hashes --strict -r .audit-requirements.txt
      - run: python -m uv run warrant db migrate
      - run: python -m uv run warrant db seed --scenario-dir examples/db/scenarios --fixture-root examples/db/fixtures
      - run: python -m uv run warrant db seed --scenario-dir examples/db/scenarios --fixture-root examples/db/fixtures
