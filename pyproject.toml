[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "warrant"
version = "0.1.0"
description = "TRUSSTED research prototype: reproducible database and evidence storage"
requires-python = ">=3.12,<3.13"
dependencies = [
  "SQLAlchemy==2.0.55",
  "alembic==1.20.1",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.170.10",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
]

[project.scripts]
warrant = "warrant.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]

[tool.uv]
exclude-newer = "2026-10-26T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
markers = ["bench: external benchmark evaluation, excluded from ordinary tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["yaml"]
# YAML values cross an untrusted boundary and are validated with Pydantic.
ignore_missing_imports = true
