[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant-pipeline"
version = "0.1.0"
description = "Decision-integrity prototype components for shopping agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "SQLAlchemy==2.0.55",
  "alembic==1.20.1",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "rfc8785==0.1.4",
  "cryptography>=44,<47",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.170.10",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20261103",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
